# Rollback-only Nginx snippet for a DRAINED node running an image without
# /readyz. Include it only while that node is out of the CLB pool, then delete
# it. A permanent 404 -> /api/status fallback hides a missing probe on new
# releases, so it must never stay in the default site.
#
# Install:  /etc/nginx/conf.d/zz-readyz-legacy.conf  (drained node only)
# Remove:   rm the file and reload before the node rejoins CLB.
location = /readyz {
    proxy_pass http://127.0.0.1:3000/api/status;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    add_header X-Fluxlane-Readyz-Source "legacy-api-status" always;
}

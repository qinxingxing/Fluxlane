server {
    server_name fluxlane.ai www.fluxlane.ai;
    root /var/www/fluxlane-static/frontend/current;
    index index.html;
    client_max_body_size 32m;

    location ^~ /static-assets/ {
        alias /var/www/fluxlane-static/shared/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /assets/fluxlane-logo.png {
        alias /var/www/fluxlane-assets/fluxlane-logo.png;
        default_type image/png;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~ ^/(api|v1|v1beta|pg|mj|dashboard\/billing|assets)(/|$) {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        sub_filter_once off;
        sub_filter '<head>' '<head><!-- Google Tag Manager --><script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({"gtm.start":new Date().getTime(),event:"gtm.js"});var f=d.getElementsByTagName(s)[0],j=d.createElement(s),dl=l!="dataLayer"?"&l="+l:"";j.async=true;j.src="https://www.googletagmanager.com/gtm.js?id="+i+dl;f.parentNode.insertBefore(j,f);})(window,document,"script","dataLayer","GTM-KCF54QNV");</script><!-- End Google Tag Manager -->';
        sub_filter '<body>' '<body><!-- Google Tag Manager (noscript) --><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KCF54QNV" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript><!-- End Google Tag Manager (noscript) -->';
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/fluxlane.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fluxlane.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name fluxlane.ai www.fluxlane.ai;
    return 301 https://$host$request_uri;
}

services:
  fluxlane-api:
    image: fluxlane/api-control:eaae4af5
    container_name: fluxlane-api
    restart: unless-stopped
    env_file:
      - /etc/fluxlane-api.env
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - /opt/fluxlane-api/data:/data
      - /opt/fluxlane-api/logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/status >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true


server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.fluxlane.ai 124.156.104.48;

    ssl_certificate /etc/nginx/tls/api.fluxlane.ai/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/api.fluxlane.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FluxlaneTLS:10m;
    ssl_session_timeout 1d;

    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

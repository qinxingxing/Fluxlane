# Fluxlane RUN node Nginx. Terminates 443 for run.fluxlane.ai and proxies relay
# traffic to 127.0.0.1:3000. CLB health checks HTTPS GET /readyz.
#
# Streaming/SSE requires response buffering off and long read timeouts. Verify
# the live file before copying.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name run.fluxlane.ai;

    ssl_certificate /etc/nginx/tls/run.fluxlane.ai/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/run.fluxlane.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FluxlaneTLS:10m;
    ssl_session_timeout 1d;

    client_max_body_size 64m;

    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:3000;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location = /readyz {
        # Maintenance switch for zero-502 rolling deploys: the CLB
        # health check fails softly while business paths keep serving.
        # Install/maintain via deploy/common/nginx-maintenance-install.sh.
        if (-f /var/run/fluxlane-maintenance) {
            return 503;
        }
        access_log off;
        proxy_pass http://127.0.0.1:3000;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        add_header Cache-Control "no-store" always;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name run.fluxlane.ai;
    return 301 https://$host$request_uri;
}

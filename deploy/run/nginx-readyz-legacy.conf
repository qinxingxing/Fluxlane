# ROLLBACK-ONLY full RUN site for an image that predates /readyz.
#
# Complete replacement site, not a snippet: a bare `location` in
# /etc/nginx/conf.d/ fails with "location directive is not allowed here".
#
# Install and revert through deploy/run/rollback.sh (FLUXLANE_LEGACY_READYZ=yes
# plus FLUXLANE_NGINX_SITE=/etc/nginx/sites-available/fluxlane-api-run), which
# resolves the real file, backs up file content (not a symlink), runs `nginx -t`,
# reloads, and restores the backup on failure.
#
# The node must be detached from CLB while this file is active. A later normal
# deploy.sh restores deploy/run/nginx.conf automatically; do not rejoin CLB with
# this shim still active.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name run.fluxlane.ai;

    ssl_certificate /etc/nginx/tls/run.fluxlane.ai/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/run.fluxlane.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FluxlaneTLS:10m;
    ssl_session_timeout 1d;

    client_max_body_size 64m;

    # Legacy shim: the rolled-back image has no /readyz, so readiness is
    # answered from /api/status. Temporary and drained-node only.
    location = /readyz {
        access_log off;
        proxy_pass http://127.0.0.1:3000/api/status;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        add_header X-Fluxlane-Readyz-Source "legacy-api-status" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        add_header Cache-Control "no-store" always;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name run.fluxlane.ai;
    return 301 https://$host$request_uri;
}

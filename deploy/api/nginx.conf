# Fluxlane API node Nginx. Terminates 80/443 for api.fluxlane.ai and proxies to
# the local container on 127.0.0.1:3000. CLB health checks GET /readyz.
#
# Replace server_name's IP with this node's address. Verify the live file before
# copying: committed templates can drift from the running node.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.fluxlane.ai;

    ssl_certificate /etc/nginx/tls/api.fluxlane.ai/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/api.fluxlane.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FluxlaneTLS:10m;
    ssl_session_timeout 1d;

    client_max_body_size 32m;

    # Probes must reach the application. Do not add a fallback that answers
    # /readyz from Nginx or from /api/status on a pooled node.
    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:3000;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location = /readyz {
        # Maintenance switch for zero-502 rolling deploys: the CLB
        # health check fails softly while business paths keep serving.
        # Install/maintain via deploy/common/nginx-maintenance-install.sh.
        if (-f /var/run/fluxlane-maintenance) {
            return 503;
        }
        access_log off;
        proxy_pass http://127.0.0.1:3000;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header Cache-Control "no-store" always;
    }
}

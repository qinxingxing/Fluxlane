# Image tag is a Git production Tag, e.g. prod-20260828-3c52e436
# Load the matching tarball before up. pull_policy never.
services:
  fluxlane-api:
    image: fluxlane/new-api:${FLUXLANE_IMAGE_TAG}
    pull_policy: never
    container_name: fluxlane-api
    restart: unless-stopped
    env_file:
      - /etc/fluxlane-api.env
    environment:
      - NODE_NAME=${FLUXLANE_NODE_NAME:-api-unset}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - /opt/fluxlane-api/data:/data
      - /opt/fluxlane-api/logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/readyz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true

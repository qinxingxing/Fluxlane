# ROLLBACK-ONLY full API site for an image that predates /readyz.
#
# This is a complete replacement site, not a snippet: `location` is only valid
# inside `server`, so dropping a bare location into /etc/nginx/conf.d/ fails
# with "location directive is not allowed here".
#
# Install and revert through deploy/api/rollback.sh (FLUXLANE_LEGACY_READYZ=yes
# plus FLUXLANE_NGINX_SITE=<live site path>), which backs up the live site,
# runs `nginx -t`, reloads, and restores the backup on failure.
#
# The node must be detached from CLB while this file is active. Restore the
# normal site (deploy/api/nginx.conf) before it rejoins: a permanent
# /readyz -> /api/status mapping hides a missing probe on new releases.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.fluxlane.ai;

    ssl_certificate /etc/nginx/tls/api.fluxlane.ai/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/api.fluxlane.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FluxlaneTLS:10m;
    ssl_session_timeout 1d;

    client_max_body_size 32m;

    # Legacy shim: the rolled-back image has no /readyz, so readiness is
    # answered from /api/status. Temporary and drained-node only.
    location = /readyz {
        access_log off;
        proxy_pass http://127.0.0.1:3000/api/status;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        add_header X-Fluxlane-Readyz-Source "legacy-api-status" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header Cache-Control "no-store" always;
    }
}

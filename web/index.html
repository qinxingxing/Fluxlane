<!doctype html>
<html lang="en" suppressHydrationWarning>
  <head>
    <meta charset="UTF-8" />
    <!-- Google Tag Manager -->
    <script>
      ;(function (w, d, s, l, i) {
        w[l] = w[l] || []
        w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' })
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l != 'dataLayer' ? '&l=' + l : ''
        j.async = true
        j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl
        f.parentNode.insertBefore(j, f)
      })(window, document, 'script', 'dataLayer', 'GTM-KCF54QNV')
    </script>
    <!-- End Google Tag Manager -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title>Fluxlane</title>
    <meta name="title" content="Fluxlane" />
    <meta
      name="description"
      content="Access leading AI models through one OpenAI-compatible API. Compare pricing, manage usage, and integrate with Fluxlane using familiar SDKs."
    />

    <meta name="theme-color" content="#0c112e" />
    <!-- Apply the persisted theme before first paint to avoid a light flash
         for dark-theme visitors on prerendered pages. -->
    <script>
      ;(function () {
        try {
          var match = document.cookie.match(/(?:^|;\s*)vite-ui-theme=([^;]+)/)
          var theme = match ? match[1] : 'dark'
          var dark =
            theme === 'dark' ||
            (theme === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.add(dark ? 'dark' : 'light')
        } catch (e) {
          /* default styles apply */
        }
      })()
    </script>
    <!-- Hide prerendered English HTML until the visitor language is applied.
         noscript keeps the English tree visible for crawlers without JS. -->
    <style>
      #root:not([data-i18n-ready]) {
        visibility: hidden;
      }
    </style>
    <noscript>
      <style>
        #root:not([data-i18n-ready]) {
          visibility: visible;
        }
      </style>
    </noscript>
    <!--umami-->
    <!--Google Analytics-->
  </head>

  <body>
    <!-- Google Tag Manager (noscript) -->
    <!-- prettier-ignore -->

    <!-- End Google Tag Manager (noscript) -->
    <div id="root" translate="no" class="notranslate"></div>
  </body>
</html>
